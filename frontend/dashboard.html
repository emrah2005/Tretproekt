<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Influenita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .sidebar-active { background-color: rgba(102, 126, 234, 0.1); border-left: 3px solid #667eea; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Sidebar -->
  <div class="flex h-screen">
    <aside class="w-64 gradient-bg text-white p-6 shadow-lg">
      <div class="flex items-center gap-3 mb-12">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
          <span class="text-purple-600 font-bold text-lg">I</span>
        </div>
        <h1 class="text-2xl font-bold">Influenita</h1>
      </div>
      
      <nav class="space-y-2">
        <button onclick="switchTab('dashboard')" id="dashboardNav" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/10 transition sidebar-active">
          📊 Dashboard
        </button>
        <button onclick="switchTab('campaigns')" id="campaignsNav" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/10 transition">
          🎯 Campaigns
        </button>
        <button onclick="switchTab('messages')" id="messagesNav" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/10 transition">
          💬 Messages
        </button>
        <button onclick="switchTab('profile')" id="profileNav" class="w-full text-left px-4 py-3 rounded-lg hover:bg-white/10 transition">
          👤 Profile
        </button>
      </nav>
      
      <div class="absolute bottom-6 left-6 right-6 border-t border-white/20 pt-6">
        <button onclick="logout()" class="w-full bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition">
          🚪 Logout
        </button>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
      <!-- Top Bar -->
      <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <h2 id="pageTitle" class="text-2xl font-bold text-gray-800">Dashboard</h2>
        <div class="flex items-center gap-4">
          <span id="userName" class="text-gray-600">Loading...</span>
          <div class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center text-white font-bold">U</div>
        </div>
      </header>
      
      <!-- Content -->
      <div class="flex-1 overflow-auto p-8">
        <!-- Dashboard Tab -->
        <div id="dashboardContent" class="tab-content active">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow">
              <h3 class="text-gray-500 text-sm font-semibold mb-2">Total Campaigns</h3>
              <p id="campaignCount" class="text-4xl font-bold text-purple-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
              <h3 class="text-gray-500 text-sm font-semibold mb-2">Applications</h3>
              <p id="appCount" class="text-4xl font-bold text-purple-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
              <h3 class="text-gray-500 text-sm font-semibold mb-2">Rating</h3>
              <p id="ratingDisplay" class="text-4xl font-bold text-purple-600">-</p>
            </div>
          </div>
          <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Quick Stats</h3>
            <p class="text-gray-600">Welcome to your dashboard! Start by creating a campaign or updating your profile.</p>
          </div>
        </div>
        
        <!-- Campaigns Tab -->
        <div id="campaignsContent" class="tab-content">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold text-gray-800">Your Campaigns</h3>
            <button onclick="document.getElementById('createCampaignModal').classList.add('active')" class="gradient-bg text-white px-6 py-2 rounded-lg hover:opacity-90">
              ➕ Create Campaign
            </button>
          </div>
          <div id="campaignsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow text-center text-gray-500">No campaigns yet</div>
          </div>
        </div>
        
        <!-- Messages Tab -->
        <div id="messagesContent" class="tab-content">
          <h3 class="text-2xl font-bold text-gray-800 mb-6">Messages</h3>
          <div class="grid grid-cols-3 gap-6 h-96">
            <div class="bg-white rounded-lg shadow border border-gray-200">
              <div id="conversationsList" class="divide-y max-h-96 overflow-auto">
                <div class="p-4 text-gray-500 text-center">No conversations</div>
              </div>
            </div>
            <div class="col-span-2 bg-white rounded-lg shadow flex flex-col">
              <div class="flex-1 p-4 overflow-auto border-b border-gray-200">
                <p class="text-gray-500 text-center">Select a conversation</p>
              </div>
              <div class="p-4 border-t border-gray-200 flex gap-2">
                <input id="messageInput" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                <button id="sendMessageBtn" class="gradient-bg text-white px-6 py-2 rounded-lg hover:opacity-90">Send</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Profile Tab -->
        <div id="profileContent" class="tab-content">
          <h3 class="text-2xl font-bold text-gray-800 mb-6">My Profile</h3>
          <div class="bg-white p-8 rounded-lg shadow max-w-2xl">
            <div class="mb-6">
              <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
              <input id="profileName" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            <div class="mb-6">
              <label class="block text-sm font-semibold text-gray-700 mb-2">Bio</label>
              <textarea id="profileBio" class="w-full px-4 py-2 border border-gray-300 rounded-lg h-24"></textarea>
            </div>
            <button class="gradient-bg text-white px-6 py-2 rounded-lg hover:opacity-90">Save Profile</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Create Campaign Modal -->
  <div id="createCampaignModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-2xl w-full mx-4">
      <h2 class="text-2xl font-bold mb-6">Create Campaign</h2>
      <form id="campaignForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Campaign Title</label>
          <input id="campaignTitle" type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
          <textarea id="campaignDesc" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 h-20"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Budget</label>
            <input id="campaignBudget" type="number" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
            <select id="campaignCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
              <option>Fashion</option>
              <option>Tech</option>
              <option>Lifestyle</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="flex gap-4 justify-end">
          <button type="button" onclick="document.getElementById('createCampaignModal').classList.remove('hidden')" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
          <button type="submit" class="gradient-bg text-white px-6 py-2 rounded-lg hover:opacity-90">Create</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="app.js"></script>
  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName + 'Content').classList.add('active');
      
      document.querySelectorAll('#dashboardNav, #campaignsNav, #messagesNav, #profileNav').forEach(el => el.classList.remove('sidebar-active'));
      document.getElementById(tabName + 'Nav').classList.add('sidebar-active');
      
      const titles = { dashboard: 'Dashboard', campaigns: 'Campaigns', messages: 'Messages', profile: 'My Profile' };
      document.getElementById('pageTitle').textContent = titles[tabName];
      
      if (tabName === 'campaigns') loadCampaigns();
      if (tabName === 'messages') loadConversations();
      if (tabName === 'dashboard') loadDashboard();
    }
  </script>
</body>
</html>
