<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influenita - Influencer Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
  </style>
</head>
<body class="bg-gray-50 font-sans">
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-purple-600 rounded-lg flex items-center justify-center text-white font-bold">I</div>
        <h1 class="text-xl font-bold">Influenita</h1>
      </div>
      <button onclick="handleLogout()" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Logout</button>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex gap-8 border-b border-gray-200 mb-8">
      <button onclick="switchTab('register')" class="pb-4 font-medium text-purple-600 border-b-2 border-purple-600">Register</button>
      <button onclick="switchTab('dashboard')" class="pb-4 font-medium text-gray-600">Dashboard</button>
      <button onclick="switchTab('applications')" class="pb-4 font-medium text-gray-600">Applications</button>
    </div>

    <div id="register" class="tab-content active">
      <div class="bg-white rounded-lg p-8 shadow-sm max-w-md">
        <h2 class="text-2xl font-bold mb-6">Register as Influencer</h2>
        <form id="registerForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-2">Full Name</label>
            <input type="text" id="fullName" placeholder="Your Name" class="w-full px-4 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Email</label>
            <input type="email" id="email" placeholder="your@email.com" class="w-full px-4 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Category</label>
            <select id="category" class="w-full px-4 py-2 border rounded-lg">
              <option value="">Select Category</option>
              <option value="fashion">Fashion</option>
              <option value="beauty">Beauty</option>
              <option value="tech">Technology</option>
            </select>
          </div>
          <button type="button" onclick="openTermsModal()" class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg">Continue</button>
        </form>
      </div>
    </div>

    <div id="dashboard" class="tab-content">
      <p class="text-gray-600">Dashboard content</p>
    </div>

    <div id="applications" class="tab-content">
      <p class="text-gray-600">Applications content</p>
    </div>
  </div>

  <div id="termsModal" class="modal">
    <div class="bg-white rounded-lg p-8 max-w-2xl">
      <h2 class="text-2xl font-bold mb-4">Terms of Use</h2>
      <p class="text-gray-700 mb-6">By registering, you agree to our terms and conditions.</p>
      <div class="flex gap-4 justify-end">
        <button onclick="closeTermsModal()" class="px-6 py-2 border rounded-lg">Decline</button>
        <button onclick="acceptTerms()" class="px-6 py-2 bg-purple-600 text-white rounded-lg">Accept</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
