<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influentia - Brand Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 700; color: #111; margin-bottom: 10px; }
        .header p { font-size: 16px; color: #666; }
        .progress { display: flex; justify-content: space-between; margin-bottom: 40px; gap: 20px; }
        .step { flex: 1; text-align: center; }
        .step-circle { width: 40px; height: 40px; border-radius: 50%; background: #e0e0e0; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #999; }
        .step.active .step-circle { background: #667eea; color: white; }
        .step.completed .step-circle { background: #4caf50; color: white; }
        .step-label { font-size: 14px; font-weight: 500; color: #999; }
        .step.active .step-label { color: #667eea; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: #333; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .button-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 30px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create Your Business Profile</h1>
            <p>Set up your company profile to start finding creators</p>
        </div>
        
        <div class="progress">
            <div class="step active" data-step="1">
                <div class="step-circle">1</div>
                <div class="step-label">Company Info</div>
            </div>
            <div class="step" data-step="2">
                <div class="step-circle">2</div>
                <div class="step-label">Campaign Preferences</div>
            </div>
        </div>
        
        <!-- Step 1: Company Information -->
        <form id="brandForm" onsubmit="handleBrandRegistration(event)">
            <div id="step-1" class="step-content">
                <div class="form-row">
                    <div class="form-group">
                        <label>Company Name *</label>
                        <input type="text" name="company_name" required>
                    </div>
                    <div class="form-group">
                        <label>Industry *</label>
                        <select name="industry" required>
                            <option value="">Select Industry</option>
                            <option value="tech">Technology</option>
                            <option value="fashion">Fashion</option>
                            <option value="beauty">Beauty</option>
                            <option value="food">Food & Beverage</option>
                            <option value="health">Health & Wellness</option>
                            <option value="finance">Finance</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>About Us *</label>
                    <textarea name="about_us" rows="4" required placeholder="Tell us about your company and what makes you unique"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Website</label>
                        <input type="url" name="website">
                    </div>
                    <div class="form-group">
                        <label>Location *</label>
                        <select name="location" required>
                            <option value="">Select Location</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="EU">European Union</option>
                            <option value="AS">Asia</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Step 2: Campaign Preferences -->
            <div id="step-2" class="step-content hidden">
                <div class="form-group">
                    <label>Campaign Title *</label>
                    <input type="text" name="campaign_title" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Target Audience Age Range *</label>
                        <select name="target_age" required>
                            <option value="">Select Age Range</option>
                            <option value="18-25">18-25</option>
                            <option value="25-35">25-35</option>
                            <option value="35-45">35-45</option>
                            <option value="45+">45+</option>
                            <option value="all">All Ages</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Preferred Influencer Gender *</label>
                        <select name="target_gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="all">All Genders</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Campaign Budget (USD) *</label>
                    <input type="number" name="budget" min="0" required>
                </div>
                <div class="form-group">
                    <label>Preferred Niches (comma-separated) *</label>
                    <input type="text" name="niches" required placeholder="e.g., Tech, Fashion, Fitness">
                </div>
                <div class="form-group">
                    <label>Campaign Brief *</label>
                    <textarea name="campaign_brief" rows="4" required placeholder="Describe your campaign goals and requirements"></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="backBtn" style="display:none;" onclick="previousStep()">Back</button>
                <button type="button" class="btn-primary" id="nextBtn" onclick="nextStep()">Next</button>
                <button type="submit" class="btn-primary" id="submitBtn" style="display:none;">Complete Registration</button>
            </div>
        </form>
    </div>
    
    <script>
        let currentStep = 1;
        const totalSteps = 2;
        
        function nextStep() {
            const form = document.getElementById('brandForm');
            const inputs = document.getElementById(`step-${currentStep}`).querySelectorAll('[required]');
            let isValid = true;
            
            inputs.forEach(input => {
                if (!input.value) {
                    isValid = false;
                    input.style.borderColor = '#ff6b6b';
                } else {
                    input.style.borderColor = '#ddd';
                }
            });
            
            if (!isValid) return;
            
            if (currentStep < totalSteps) {
                document.getElementById(`step-${currentStep}`).classList.add('hidden');
                document.querySelector(`[data-step="${currentStep}"]`).classList.remove('active');
                document.querySelector(`[data-step="${currentStep}"]`).classList.add('completed');
                
                currentStep++;
                document.getElementById(`step-${currentStep}`).classList.remove('hidden');
                document.querySelector(`[data-step="${currentStep}"]`).classList.add('active');
                
                updateButtons();
            }
        }
        
        function previousStep() {
            if (currentStep > 1) {
                document.getElementById(`step-${currentStep}`).classList.add('hidden');
                document.querySelector(`[data-step="${currentStep}"]`).classList.remove('active');
                
                currentStep--;
                document.getElementById(`step-${currentStep}`).classList.remove('hidden');
                document.querySelector(`[data-step="${currentStep}"]`).classList.add('active');
                document.querySelector(`[data-step="${currentStep + 1}"]`).classList.remove('completed');
                
                updateButtons();
            }
        }
        
        function updateButtons() {
            document.getElementById('backBtn').style.display = currentStep > 1 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = currentStep < totalSteps ? 'block' : 'none';
            document.getElementById('submitBtn').style.display = currentStep === totalSteps ? 'block' : 'none';
        }
        
        function handleBrandRegistration(event) {
            event.preventDefault();
            const form = document.getElementById('brandForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            console.log('Brand Registration Data:', data);
            // TODO: Send to API
            alert('Brand registration submitted! (Check console for data)');
        }
        
        updateButtons();
    </script>
</body>
</html>
