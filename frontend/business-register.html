<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Registration - Influenita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-16">
    <!-- Header -->
    <div class="text-center mb-12">
      <div class="flex items-center justify-center gap-3 mb-4">
        <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center text-white font-bold">I</div>
        <h1 class="text-3xl font-bold text-gray-800">Influenita</h1>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Brand Registration</h2>
      <p class="text-gray-600">Create your brand account to start collaborating with creators</p>
    </div>

    <!-- Registration Form -->
    <div class="bg-white rounded-lg shadow-lg p-8">
      <form id="brandRegisterForm" class="space-y-6">
        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address *</label>
          <input id="brandEmail" type="email" required placeholder="your@company.com" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
          <span class="text-red-500 text-sm" id="emailError"></span>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password *</label>
          <input id="brandPassword" type="password" required placeholder="At least 8 characters" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
          <span class="text-red-500 text-sm" id="passwordError"></span>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password *</label>
          <input id="brandPasswordConfirm" type="password" required placeholder="Confirm your password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
          <span class="text-red-500 text-sm" id="confirmError"></span>
        </div>

        <!-- Company Name -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Company Name *</label>
          <input id="companyName" type="text" required placeholder="Your Company Name" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
        </div>

        <!-- Industry -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Industry *</label>
          <select id="brandIndustry" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
            <option value="">Select Your Industry</option>
            <option value="Technology">Technology</option>
            <option value="Fashion">Fashion</option>
            <option value="Beauty">Beauty & Cosmetics</option>
            <option value="Food">Food & Beverage</option>
            <option value="Health">Health & Wellness</option>
            <option value="Finance">Finance</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- About Company -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">About Your Company *</label>
          <textarea id="companyBio" required placeholder="Tell us about your company..." rows="4" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition"></textarea>
        </div>

        <!-- Website -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Website URL</label>
          <input id="companyWebsite" type="url" placeholder="https://yourcompany.com" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
        </div>

        <!-- Location -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Location *</label>
          <input id="companyLocation" type="text" required placeholder="City, Country" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 transition">
        </div>

        <!-- Terms & Conditions -->
        <div class="flex items-center gap-3">
          <input id="termsAccepted" type="checkbox" required class="w-5 h-5 text-purple-600 rounded">
          <label for="termsAccepted" class="text-sm text-gray-700">170
              the Terms & Conditions *</label>
        </div>
        <span class="text-red-500 text-sm" id="termsError"></span>

        <!-- Loading and Error Messages -->
        <div id="loadingMsg" class="hidden text-center text-purple-600 font-semibold">Creating account...</div>
        <div id="errorMsg" class="hidden text-center text-red-600 font-semibold p-4 bg-red-50 rounded-lg"></div>

        <!-- Submit Button -->
        <div class="flex gap-4">
          <button type="button" onclick="window.history.back()" class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition">
            Back
          </button>
          <button type="submit" class="flex-1 gradient-bg text-white px-6 py-3 font-semibold rounded-lg hover:opacity-90 transition">
            Create Account
          </button>
        </div>
      </form>

      <!-- Login Link -->
      <div class="text-center mt-6 text-gray-600">
        Already have an account? <a href="index.html" class="text-purple-600 font-semibold hover:underline">Login here</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:5000/api';

    document.getElementById('brandRegisterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      
      // Get form values
      const email = document.getElementById('brandEmail').value.trim();
      const password = document.getElementById('brandPassword').value;
      const passwordConfirm = document.getElementById('brandPasswordConfirm').value;
      const companyName = document.getElementById('companyName').value.trim();
      const industry = document.getElementById('brandIndustry').value;
      const companyBio = document.getElementById('companyBio').value.trim();
      const website = document.getElementById('companyWebsite').value.trim();
      const location = document.getElementById('companyLocation').value.trim();
      const termsAccepted = document.getElementById('termsAccepted').checked;

      // Validation
      let isValid = true;

      if (!email || !email.includes('@')) {
        document.getElementById('emailError').textContent = 'Please enter a valid email';
        isValid = false;
      }

      if (!password || password.length < 8) {
        document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
        isValid = false;
      }

      if (password !== passwordConfirm) {
        document.getElementById('confirmError').textContent = 'Passwords do not match';
        isValid = false;
      }

      if (!termsAccepted) {
        document.getElementById('termsError').textContent = 'You must accept the terms';
        isValid = false;
      }

      if (!isValid) return;

      // Show loading
      document.getElementById('loadingMsg').classList.remove('hidden');

      try {
        const response = await fetch(API_BASE_URL + '/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
            name: companyName,
            email: email,
            password: password,
            userType: 'brand',
            companyName: companyName,
            industry: industry,
            aboutCompany: companyBio,
            location: location,
            acceptTerms: termsAccepted
                 website: website
                 })
        
        const data = await response.json();

        if (response.ok) {
          alert('✅ Account created successfully! Redirecting to login...');
          window.location.href = 'index.html';
        } else {
          document.getElementById('errorMsg').textContent = data.message || 'Registration failed';
          document.getElementById('errorMsg').classList.remove('hidden');
        }
      } catch (error) {
        console.error('Registration error:', error);
        document.getElementById('errorMsg').textContent = 'Connection error: ' + error.message + '. Make sure your API is running at ' + API_BASE_URL;
        document.getElementById('errorMsg').classList.remove('hidden');
      } finally {
        document.getElementById('loadingMsg').classList.add('hidden');
      }
    });

    function clearErrors() {
      document.querySelectorAll('[id$="Error"]').forEach(el => {
        el.textContent = '';
      });
      document.getElementById('errorMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
